// ─── Rendering Constants ──────────────────────────────────────────────────────

const COL_HEIGHT = 22;
const HEADER_HEIGHT = 36;
const TABLE_WIDTH = 250;
const TABLE_PADDING = 8;
const CORNER_RADIUS = 8;

let showColumns = true;
let viewX = 0, viewY = 0, scale = 0.85;
let isDragging = false, dragStartX, dragStartY;
let dragTable = null, dragTableOffX, dragTableOffY;
let highlightedTable = null;

const svgNS = 'http://www.w3.org/2000/svg';
const canvas = document.getElementById('canvas');

function getTableHeight(table) {
  if (!showColumns) return HEADER_HEIGHT + 12;
  return HEADER_HEIGHT + table.columns.length * COL_HEIGHT + TABLE_PADDING * 2;
}

function getTableByName(name) {
  return tables.find(t => t.name === name);
}

function getColor(domain) {
  return COLORS[domain] || COLORS.core;
}

// ─── SVG Helpers ──────────────────────────────────────────────────────────────

function createSVGElement(tag, attrs = {}) {
  const el = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function updateTransform() {
  const g = document.getElementById('worldGroup');
  if (g) g.setAttribute('transform', `translate(${viewX},${viewY}) scale(${scale})`);
  document.getElementById('zoomDisplay').textContent = Math.round(scale * 100) + '%';
  updateMinimap();
}

// ─── Draw Tables ──────────────────────────────────────────────────────────────

function renderTable(table) {
  const g = createSVGElement('g', { class: 'table-group', 'data-table': table.name });
  const color = getColor(table.domain);
  const h = getTableHeight(table);

  // Shadow
  const shadow = createSVGElement('rect', {
    class: 'table-shadow',
    x: table.x + 4, y: table.y + 4,
    width: TABLE_WIDTH, height: h,
    rx: CORNER_RADIUS, ry: CORNER_RADIUS,
    fill: 'rgba(0,0,0,0.4)',
    opacity: '0.3',
  });
  g.appendChild(shadow);

  // Background
  const bg = createSVGElement('rect', {
    x: table.x, y: table.y,
    width: TABLE_WIDTH, height: h,
    rx: CORNER_RADIUS, ry: CORNER_RADIUS,
    fill: '#12141c',
    stroke: color.border,
    'stroke-width': '1.5',
  });
  g.appendChild(bg);

  // Header bg
  const headerClip = createSVGElement('clipPath', { id: `clip-${table.name}` });
  headerClip.appendChild(createSVGElement('rect', {
    x: table.x, y: table.y,
    width: TABLE_WIDTH, height: HEADER_HEIGHT,
    rx: CORNER_RADIUS, ry: CORNER_RADIUS,
  }));
  g.appendChild(headerClip);

  const headerBg = createSVGElement('rect', {
    x: table.x, y: table.y,
    width: TABLE_WIDTH, height: HEADER_HEIGHT + CORNER_RADIUS,
    fill: color.headerBg,
    'clip-path': `url(#clip-${table.name})`,
  });
  g.appendChild(headerBg);

  // Header line
  g.appendChild(createSVGElement('line', {
    x1: table.x, y1: table.y + HEADER_HEIGHT,
    x2: table.x + TABLE_WIDTH, y2: table.y + HEADER_HEIGHT,
    stroke: color.border, 'stroke-width': '1',
  }));

  // Table name
  const nameText = createSVGElement('text', {
    x: table.x + 14, y: table.y + 23,
    fill: color.header,
    'font-family': 'Outfit, sans-serif',
    'font-size': '13',
    'font-weight': '600',
    'letter-spacing': '0.3',
  });
  nameText.textContent = table.name;
  g.appendChild(nameText);

  // Table name (SQL)
  const sqlName = createSVGElement('text', {
    x: table.x + TABLE_WIDTH - 14, y: table.y + 23,
    fill: 'rgba(255,255,255,0.2)',
    'font-family': 'JetBrains Mono, monospace',
    'font-size': '9',
    'text-anchor': 'end',
  });
  sqlName.textContent = table.tableName;
  g.appendChild(sqlName);

  // Columns
  if (showColumns) {
    table.columns.forEach((col, i) => {
      const cy = table.y + HEADER_HEIGHT + TABLE_PADDING + i * COL_HEIGHT + 15;

      // PK/FK badge
      if (col.pk || col.fk) {
        const badge = createSVGElement('text', {
          x: table.x + 12, y: cy,
          fill: col.pk ? '#eab308' : color.header,
          'font-family': 'JetBrains Mono, monospace',
          'font-size': '8',
          'font-weight': '600',
          opacity: '0.7',
        });
        badge.textContent = col.pk ? 'PK' : 'FK';
        g.appendChild(badge);
      }

      // Column name
      const colText = createSVGElement('text', {
        x: table.x + (col.pk || col.fk ? 32 : 14),
        y: cy,
        fill: col.pk ? '#e2e6ee' : (col.fk ? '#9ca3b0' : '#6b7280'),
        'font-family': 'JetBrains Mono, monospace',
        'font-size': '10.5',
        'font-weight': col.pk ? '600' : '400',
      });
      colText.textContent = col.name;
      g.appendChild(colText);

      // Type
      const typeText = createSVGElement('text', {
        x: table.x + TABLE_WIDTH - 12, y: cy,
        fill: 'rgba(255,255,255,0.18)',
        'font-family': 'JetBrains Mono, monospace',
        'font-size': '9',
        'text-anchor': 'end',
      });
      typeText.textContent = col.type;
      g.appendChild(typeText);

      // Unique badge
      if (col.unique) {
        const uText = createSVGElement('text', {
          x: table.x + TABLE_WIDTH - 12 - (col.type.length * 5.5) - 6, y: cy,
          fill: '#f59e0b',
          'font-family': 'JetBrains Mono, monospace',
          'font-size': '7',
          'text-anchor': 'end',
          opacity: '0.5',
        });
        uText.textContent = 'UQ';
        g.appendChild(uText);
      }
    });
  }

  // Interaction
  g.addEventListener('mouseenter', () => {
    highlightedTable = table.name;
    updateRelationHighlights();
  });
  g.addEventListener('mouseleave', () => {
    highlightedTable = null;
    updateRelationHighlights();
  });

  return g;
}

// ─── Draw Relations ───────────────────────────────────────────────────────────

function getAnchorPoints(table) {
  const h = getTableHeight(table);
  return {
    left: { x: table.x, y: table.y + h / 2 },
    right: { x: table.x + TABLE_WIDTH, y: table.y + h / 2 },
    top: { x: table.x + TABLE_WIDTH / 2, y: table.y },
    bottom: { x: table.x + TABLE_WIDTH / 2, y: table.y + h },
  };
}

function getBestAnchors(fromTable, toTable) {
  const fa = getAnchorPoints(fromTable);
  const ta = getAnchorPoints(toTable);
  let bestDist = Infinity, bestFrom, bestTo, bestFromSide, bestToSide;

  for (const [fs, fp] of Object.entries(fa)) {
    for (const [ts, tp] of Object.entries(ta)) {
      const d = Math.hypot(fp.x - tp.x, fp.y - tp.y);
      if (d < bestDist) {
        bestDist = d;
        bestFrom = fp;
        bestTo = tp;
        bestFromSide = fs;
        bestToSide = ts;
      }
    }
  }
  return { from: bestFrom, to: bestTo, fromSide: bestFromSide, toSide: bestToSide };
}

function getControlOffset(side) {
  const amt = 60;
  switch (side) {
    case 'left': return { x: -amt, y: 0 };
    case 'right': return { x: amt, y: 0 };
    case 'top': return { x: 0, y: -amt };
    case 'bottom': return { x: 0, y: amt };
  }
}

function renderRelation(rel) {
  const [fromName, , toName, toCol, cardinality] = rel;
  const fromTable = getTableByName(fromName);
  const toTable = getTableByName(toName);
  if (!fromTable || !toTable) return null;

  const color = getColor(fromTable.domain);
  const g = createSVGElement('g', { 'data-from': fromName, 'data-to': toName, class: 'relation-group' });

  const { from, to, fromSide, toSide } = getBestAnchors(fromTable, toTable);
  const cFrom = getControlOffset(fromSide);
  const cTo = getControlOffset(toSide);

  const path = createSVGElement('path', {
    d: `M ${from.x} ${from.y} C ${from.x + cFrom.x} ${from.y + cFrom.y}, ${to.x + cTo.x} ${to.y + cTo.y}, ${to.x} ${to.y}`,
    stroke: color.line,
    class: 'relation-line',
    'data-from': fromName,
    'data-to': toName,
  });
  g.appendChild(path);

  // Crow's foot at "to" end (many side for 1:N)
  if (cardinality === '1:N') {
    const angle = Math.atan2(to.y - (to.y + cTo.y), to.x - (to.x + cTo.x));
    const len = 10;
    const spread = 0.4;

    const crowFoot = createSVGElement('g', {
      class: 'crow-foot',
      'data-from': fromName,
      'data-to': toName,
    });

    // Three lines forming crow's foot
    for (const s of [-spread, 0, spread]) {
      const ex = to.x - Math.cos(angle + s) * len;
      const ey = to.y - Math.sin(angle + s) * len;
      crowFoot.appendChild(createSVGElement('line', {
        x1: to.x, y1: to.y,
        x2: ex, y2: ey,
        stroke: color.line,
        'stroke-width': '1.5',
      }));
    }

    // Cross bar near crow's foot
    const barDist = 14;
    const barLen = 6;
    const bx = to.x - Math.cos(angle) * barDist;
    const by = to.y - Math.sin(angle) * barDist;
    const perpAngle = angle + Math.PI / 2;
    crowFoot.appendChild(createSVGElement('line', {
      x1: bx - Math.cos(perpAngle) * barLen,
      y1: by - Math.sin(perpAngle) * barLen,
      x2: bx + Math.cos(perpAngle) * barLen,
      y2: by + Math.sin(perpAngle) * barLen,
      stroke: color.line,
      'stroke-width': '1.5',
    }));

    g.appendChild(crowFoot);

    // "One" indicator at from end
    const fromAngle = Math.atan2(from.y - (from.y + cFrom.y), from.x - (from.x + cFrom.x));
    const oneBarDist = 8;
    const oneBx = from.x - Math.cos(fromAngle) * oneBarDist;
    const oneBy = from.y - Math.sin(fromAngle) * oneBarDist;
    const onePerpAngle = fromAngle + Math.PI / 2;

    const oneMark = createSVGElement('line', {
      x1: oneBx - Math.cos(onePerpAngle) * barLen,
      y1: oneBy - Math.sin(onePerpAngle) * barLen,
      x2: oneBx + Math.cos(onePerpAngle) * barLen,
      y2: oneBy + Math.sin(onePerpAngle) * barLen,
      stroke: color.line,
      'stroke-width': '1.5',
      class: 'crow-foot',
      'data-from': fromName,
      'data-to': toName,
    });
    g.appendChild(oneMark);
  } else {
    // 1:1 — bars at both ends
    const fromAngle = Math.atan2(from.y - (from.y + cFrom.y), from.x - (from.x + cFrom.x));
    const toAngle = Math.atan2(to.y - (to.y + cTo.y), to.x - (to.x + cTo.x));
    const barLen = 6;

    for (const [pt, ang] of [[from, fromAngle], [to, toAngle]]) {
      const bx = pt.x - Math.cos(ang) * 8;
      const by = pt.y - Math.sin(ang) * 8;
      const perpAngle = ang + Math.PI / 2;
      g.appendChild(createSVGElement('line', {
        x1: bx - Math.cos(perpAngle) * barLen,
        y1: by - Math.sin(perpAngle) * barLen,
        x2: bx + Math.cos(perpAngle) * barLen,
        y2: by + Math.sin(perpAngle) * barLen,
        stroke: color.line,
        'stroke-width': '1.5',
        class: 'crow-foot',
        'data-from': fromName,
        'data-to': toName,
      }));
    }
  }

  return g;
}

function updateRelationHighlights() {
  document.querySelectorAll('.relation-line').forEach(el => {
    const from = el.getAttribute('data-from');
    const to = el.getAttribute('data-to');
    const isHighlighted = highlightedTable && (from === highlightedTable || to === highlightedTable);
    el.classList.toggle('highlighted', isHighlighted);
  });
  document.querySelectorAll('.crow-foot').forEach(el => {
    const from = el.getAttribute('data-from');
    const to = el.getAttribute('data-to');
    const isHighlighted = highlightedTable && (from === highlightedTable || to === highlightedTable);
    el.classList.toggle('highlighted', isHighlighted);
  });
}

// ─── Render All ───────────────────────────────────────────────────────────────

function renderAll() {
  canvas.innerHTML = '';
  const worldGroup = createSVGElement('g', { id: 'worldGroup' });

  // Relations layer (behind)
  const relGroup = createSVGElement('g', { id: 'relationsGroup' });
  relations.forEach(rel => {
    const g = renderRelation(rel);
    if (g) relGroup.appendChild(g);
  });
  worldGroup.appendChild(relGroup);

  // Tables layer (front)
  const tablesGroup = createSVGElement('g', { id: 'tablesGroup' });
  tables.forEach(table => {
    tablesGroup.appendChild(renderTable(table));
  });
  worldGroup.appendChild(tablesGroup);

  canvas.appendChild(worldGroup);
  updateTransform();
}

function rerenderRelations() {
  const relGroup = document.getElementById('relationsGroup');
  if (!relGroup) return;
  relGroup.innerHTML = '';
  relations.forEach(rel => {
    const g = renderRelation(rel);
    if (g) relGroup.appendChild(g);
  });
}

// ─── Pan & Zoom ───────────────────────────────────────────────────────────────

canvas.addEventListener('mousedown', (e) => {
  // Check if clicking on a table
  let target = e.target;
  let tableGroup = null;
  while (target && target !== canvas) {
    if (target.classList && target.classList.contains('table-group')) {
      tableGroup = target;
      break;
    }
    target = target.parentElement;
  }

  if (tableGroup) {
    const tableName = tableGroup.getAttribute('data-table');
    const table = getTableByName(tableName);
    if (table) {
      dragTable = table;
      const pt = canvas.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      dragTableOffX = e.clientX / scale - table.x - viewX / scale;
      dragTableOffY = e.clientY / scale - table.y - viewY / scale;
      tableGroup.classList.add('dragging');
      e.preventDefault();
      return;
    }
  }

  isDragging = true;
  dragStartX = e.clientX - viewX;
  dragStartY = e.clientY - viewY;
  document.body.classList.add('grabbing');
});

window.addEventListener('mousemove', (e) => {
  if (dragTable) {
    dragTable.x = e.clientX / scale - dragTableOffX - viewX / scale;
    dragTable.y = e.clientY / scale - dragTableOffY - viewY / scale;
    renderAll();
    return;
  }
  if (!isDragging) return;
  viewX = e.clientX - dragStartX;
  viewY = e.clientY - dragStartY;
  updateTransform();
});

window.addEventListener('mouseup', () => {
  if (dragTable) {
    document.querySelectorAll('.table-group.dragging').forEach(el => el.classList.remove('dragging'));
    dragTable = null;
    return;
  }
  isDragging = false;
  document.body.classList.remove('grabbing');
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.min(3, Math.max(0.15, scale * delta));

  // Zoom toward cursor
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  viewX = mx - (mx - viewX) * (newScale / scale);
  viewY = my - (my - viewY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, { passive: false });

// ─── Toolbar ──────────────────────────────────────────────────────────────────

function zoomIn() { scale = Math.min(3, scale * 1.2); updateTransform(); }
function zoomOut() { scale = Math.max(0.15, scale * 0.83); updateTransform(); }

function fitToScreen() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  tables.forEach(t => {
    minX = Math.min(minX, t.x);
    minY = Math.min(minY, t.y);
    maxX = Math.max(maxX, t.x + TABLE_WIDTH);
    maxY = Math.max(maxY, t.y + getTableHeight(t));
  });

  const pad = 80;
  const w = maxX - minX + pad * 2;
  const h = maxY - minY + pad * 2;
  const sw = window.innerWidth / w;
  const sh = window.innerHeight / h;
  scale = Math.min(sw, sh, 1.2);
  viewX = (window.innerWidth - w * scale) / 2 - minX * scale + pad * scale;
  viewY = (window.innerHeight - h * scale) / 2 - minY * scale + pad * scale;
  updateTransform();
}

function resetView() {
  scale = 0.85;
  viewX = 0;
  viewY = 0;
  updateTransform();
}

function toggleColumns() {
  showColumns = !showColumns;
  renderAll();
}

// ─── Search ───────────────────────────────────────────────────────────────────

function handleSearch(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.table-group').forEach(g => {
    const name = g.getAttribute('data-table').toLowerCase();
    const table = getTableByName(g.getAttribute('data-table'));
    const colMatch = table && table.columns.some(c => c.name.toLowerCase().includes(q));
    const match = !q || name.includes(q) || colMatch;
    g.style.opacity = match ? '1' : '0.15';
  });
}

// ─── Minimap ──────────────────────────────────────────────────────────────────

function updateMinimap() {
  const mc = document.getElementById('minimapCanvas');
  const ctx = mc.getContext('2d');
  const mw = mc.width, mh = mc.height;
  ctx.clearRect(0, 0, mw, mh);

  // Background
  ctx.fillStyle = 'rgba(10,11,15,0.8)';
  ctx.fillRect(0, 0, mw, mh);

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  tables.forEach(t => {
    minX = Math.min(minX, t.x);
    minY = Math.min(minY, t.y);
    maxX = Math.max(maxX, t.x + TABLE_WIDTH);
    maxY = Math.max(maxY, t.y + getTableHeight(t));
  });

  const pad = 40;
  const worldW = maxX - minX + pad * 2;
  const worldH = maxY - minY + pad * 2;
  const ms = Math.min(mw / worldW, mh / worldH);
  const ox = (mw - worldW * ms) / 2 - minX * ms + pad * ms;
  const oy = (mh - worldH * ms) / 2 - minY * ms + pad * ms;

  // Draw table dots
  tables.forEach(t => {
    const color = getColor(t.domain);
    ctx.fillStyle = color.header;
    ctx.globalAlpha = 0.6;
    ctx.fillRect(t.x * ms + ox, t.y * ms + oy, TABLE_WIDTH * ms, getTableHeight(t) * ms);
  });
  ctx.globalAlpha = 1;

  // Viewport rect
  const vx = -viewX / scale;
  const vy = -viewY / scale;
  const vw = window.innerWidth / scale;
  const vh = window.innerHeight / scale;

  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(vx * ms + ox, vy * ms + oy, vw * ms, vh * ms);
}

// ─── Init ─────────────────────────────────────────────────────────────────────

renderAll();
fitToScreen();

window.addEventListener('resize', () => updateMinimap());
</script>
</body>
</html>
