# Lead Routing — Docker Compose
# Generated by lead-routing CLI on 2026-02-28T15:54:04.102Z
# Do not edit manually — re-run `lead-routing init` to regenerate.
services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: leadrouting
      POSTGRES_USER: leadrouting
      POSTGRES_PASSWORD: fec89d4e98725239f20f324a7c1ae585
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadrouting"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/lead-routing/web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env.web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  engine:
    image: ghcr.io/lead-routing/engine:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env.engine
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: