# Lead Routing — Local Dev Docker Compose
# Generated by lead-routing dev — do not edit manually.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: leadrouting
      POSTGRES_USER: leadrouting
      POSTGRES_PASSWORD: 94292ed91244e289ed41d94609d3ef89
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadrouting"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass aac0b48761f8519501a820d1fba06aaf
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a aac0b48761f8519501a820d1fba06aaf ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/atgatzby/lead-routing-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  engine:
    image: ghcr.io/atgatzby/lead-routing-engine:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env.engine
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
