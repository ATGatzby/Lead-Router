name: Publish CLI to npm

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @lead-routing/cli build

      - name: Verify npm token and debug npmrc
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN secret is not set or is empty!"
            exit 1
          fi
          echo "NPM_TOKEN is set (length: ${#NPM_TOKEN})"
          echo "--- ~/.npmrc ---"
          cat ~/.npmrc 2>/dev/null || echo "(none)"
          echo "--- apps/cli/.npmrc ---"
          cat apps/cli/.npmrc 2>/dev/null || echo "(none)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish --access public --ignore-scripts
        working-directory: apps/cli
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
